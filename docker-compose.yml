services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: espada-postgres-1
    restart: unless-stopped
    environment:
      POSTGRES_USER: espada
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localdev}
      POSTGRES_DB: espada
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    mem_limit: 4g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U espada -d espada"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: espada-redis-1
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-localdev}
    volumes:
      - redisdata:/data
    ports:
      - "127.0.0.1:6379:6379"
    mem_limit: 512m

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - .env
    volumes:
      - uploads:/app/uploads
    expose:
      - "3000"
    mem_limit: 1g

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - .env
    volumes:
      - uploads:/app/uploads
    mem_limit: 3g

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 256m

volumes:
  pgdata:
  redisdata:
  uploads:
  caddy_data:
  caddy_config: